[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verifiable-claim-seed"
version = "1.3.1"
description = "Machine-checkable claim contract + zero-dependency verification gate. 可复现≠可验证: repro+frozen prove internal consistency; external correctness is carried by the anchor."
readme = "README.md"
license = "MIT"
requires-python = ">=3.6"
keywords = ["verifiable-claims", "trust", "provenance", "verification", "zero-dependency", "reproducible"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Security :: Cryptography",
]
dependencies = []
authors = [{ name = "verifiable-claim-seed contributors" }]

[project.scripts]
verify-claim = "verifiable_claim_seed.verify_claim:main"
verifiable-claim-mcp = "verifiable_claim_seed.mcp_server:main"
verifiable-claim-seed = "verifiable_claim_seed.mcp_server:main"

[project.urls]
Repository = "https://github.com/elwsls/verifiable-claim-seed"
Documentation = "https://github.com/elwsls/verifiable-claim-seed/blob/main/README.md"

[tool.setuptools]
packages = ["verifiable_claim_seed"]
include-package-data = true

[tool.setuptools.package-data]
verifiable_claim_seed = [
  "schema/*.json",
  "claims/*.json",
  "data/*",
  "scripts/*.py",
]
